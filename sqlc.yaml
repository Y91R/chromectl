version: "2"
sql:
  - engine: "postgresql"
    # Схема — это миграции: sqlc проверяет запросы против того же DDL, который
    # накатывается в проде, и рассинхрон ловится генерацией, а не в рантайме.
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "gen/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true

version: "2"

linters:
  default: standard
  enable:
    - depguard
    - gocritic
    - misspell
    - nolintlint
    - unconvert

  settings:
    depguard:
      rules:
        # Транспорт CDP переиспользуется всеми командами: знание о CLI или формате
        # вывода внутри него привязало бы протокол к одной команде.
        cdp:
          files: ["**/internal/cdp/**"]
          deny:
            - pkg: github.com/Y91R/chromectl/internal/command
              desc: транспорт не знает про команды
            - pkg: github.com/Y91R/chromectl/internal/output
              desc: транспорт не знает про формат вывода
            - pkg: github.com/spf13/cobra
              desc: транспорт не знает про CLI

        # Зависимость идёт внутрь: cmd собирает команды из internal, не наоборот.
        internal:
          files: ["**/internal/**"]
          deny:
            - pkg: github.com/Y91R/chromectl/cmd
              desc: internal не зависит от точки входа

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

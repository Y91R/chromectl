version: "2"

linters:
  default: standard
  enable:
    - depguard
    - gocritic
    - misspell
    - nolintlint
    - unconvert

  exclusions:
    paths:
      - gen

  settings:
    depguard:
      rules:
        # Домен не знает ни про генерат, ни про транспорт, ни про драйверы —
        # ради этого и затевалась вся раскладка по слоям.
        domain:
          # Тесты домена исключены: моки лежат в gen/, и запрет импорта генерата
          # сделал бы невозможным их использование там, где они и нужны.
          files: ["**/internal/service/**", "!**/internal/service/**/*_test.go"]
          deny:
            - pkg: github.com/your-org/chrome_skill/gen
              desc: домен не зависит от сгенерированного кода
            - pkg: github.com/labstack/echo/v4
              desc: домен не знает про HTTP
            - pkg: github.com/jackc/pgx/v5
              desc: домен не знает про драйвер БД
            # Зависимость идёт только внутрь: адаптеры знают про домен, домен
            # про адаптеры — нет. Иначе usecase начнёт брать конкретный
            # репозиторий вместо интерфейса из своего contracts.go.
            - pkg: github.com/your-org/chrome_skill/internal/repository
              desc: домен не зависит от адаптера БД — объявите интерфейс в contracts.go
            - pkg: github.com/your-org/chrome_skill/internal/httptransport
              desc: домен не зависит от транспорта
            - pkg: github.com/your-org/chrome_skill/internal/server
              desc: домен не зависит от HTTP-серверов
            - pkg: github.com/your-org/chrome_skill/internal/app
              desc: домен не зависит от сборки графа

        # Транспорт ходит в БД только через репозиторий.
        transport:
          files: ["**/internal/httptransport/**"]
          deny:
            - pkg: github.com/your-org/chrome_skill/gen/db
              desc: транспорт не работает с БД напрямую
            - pkg: github.com/jackc/pgx/v5
              desc: транспорт не работает с БД напрямую

        # Репозиторий не знает про модели внешнего API.
        repository:
          files: ["**/internal/repository/**"]
          deny:
            - pkg: github.com/your-org/chrome_skill/gen/api
              desc: репозиторий не знает про модели HTTP API

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
